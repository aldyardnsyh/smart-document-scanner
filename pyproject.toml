[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = ["frontend", "build"]

[[tool.mypy.overrides]]
# Third-party wheels that ship no type information. `pytesseract` is retained for
# reference only; the runtime OCR engine is PP-OCR through ONNX Runtime.
module = ["cv2", "numpy", "pytesseract", "rapidocr", "onnxruntime", "shapely", "pyclipper"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
